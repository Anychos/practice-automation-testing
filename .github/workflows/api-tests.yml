name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout test project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Checkout tested application
        uses: actions/checkout@v4
        with:
          repository: Anychos/practice-automation-app
          ref: main
          path: practice-automation-app

      - name: Start tested API
        working-directory: practice-automation-app
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test up -d --build

      - name: Wait for API readiness
        working-directory: practice-automation-app
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test logs
          exit 1

      - name: Configure API tests
        run: |
          cat > .env <<'EOF'
          HTTP_CLIENT.BASE_URL=http://127.0.0.1:8000/api/v1
          HTTP_CLIENT.TIMEOUT=10
          ADMIN_LOGIN_DATA.EMAIL=admin@example.com
          ADMIN_LOGIN_DATA.PASSWORD=AdminPassword123!
          EOF

      - name: Check code style
        run: |
          ruff check .
          ruff format --check .

      - name: Run API tests
        run: python -m pytest -q

      - name: Show application logs on failure
        if: failure()
        working-directory: practice-automation-app
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test logs

      - name: Stop tested application
        if: always()
        working-directory: practice-automation-app
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test down -v
